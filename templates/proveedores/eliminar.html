{% extends 'base.html' %}

{% block title %}Eliminar Proveedor{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white fw-semibold">
                <i class="bi bi-exclamation-triangle me-2"></i>Confirmar eliminación
            </div>
            <div class="card-body p-4 text-center">
                <p class="mb-1">¿Estás seguro de que deseas eliminar al proveedor:</p>
                <p class="fw-bold fs-5">{{ proveedor.nombre }}</p>
                <p class="text-muted small">Esta acción no se puede deshacer.</p>
                <form method="post" class="d-flex gap-2 justify-content-center mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash me-2"></i>Sí, eliminar
                    </button>
                    <a href="{% url 'lista_proveedores' %}" class="btn btn-outline-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
