{% extends 'base.html' %}

{% block title %}Eliminar Producto{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card text-center">
            <div class="card-body p-4">
                <i class="bi bi-exclamation-triangle-fill fs-1 text-danger mb-3 d-block"></i>
                <h5 class="fw-bold">¿Eliminar producto?</h5>
                <p class="text-muted">
                    Estás a punto de eliminar <strong>{{ producto.nombre }}</strong>.
                    Esta acción no se puede deshacer.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center mt-3">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-2"></i>Sí, eliminar
                        </button>
                        <a href="{% url 'lista_productos' %}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
