{% extends 'base.html' %}

{% block title %}Cerrar Sesión{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card mt-4 text-center">
            <div class="card-body p-4">
                <i class="bi bi-box-arrow-right fs-1 text-warning mb-3 d-block"></i>
                <h5 class="fw-bold">¿Cerrar sesión?</h5>
                <p class="text-muted">¿Estás seguro de que deseas salir del sistema?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center mt-3">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>Sí, salir
                        </button>
                        <a href="{% url 'lista_productos' %}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
